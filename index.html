<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#ccc" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

        <title>Title of the Page</title>
        <meta name="description" content="Description of the Page">

        <!-- Tab Icons and theme -->
        <link rel="icon" href="./images/favicon.ico" sizes="any">
        <link rel="shortcut icon" href="./images/favicon.ico">

        <!-- PNG Icons -->
        <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-16x16.png">
        <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

        <!-- SVG Icons -->
        <link rel="icon" type="image/svg+xml" href="./images/favicon.svg">

        <!-- Apple Touch Icon (iPhone/iPad) -->
        <link rel="apple-touch-icon" sizes="180x180" href="./images/apple-touch-icon.png">

        <!-- Mask Icon for Safari -->
        <link rel="mask-icon" href="./images/safari-pinned-tab.svg" color="#013430">

        <!-- PWA Manifest -->
        <link rel="manifest" href="./images/site.webmanifest">
        <meta name="theme-color" content="#ffffff">

        <!-- Microsoft (Windows Tiles) -->
        <meta name="msapplication-TileColor" content="#ffffff">
        <meta name="msapplication-TileImage" content="./images/mstile-150x150.png">

        <!-- Apple Web App -->
        <meta name="application-name" content="dev.to">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="blue">
        <meta name="apple-mobile-web-app-title" content="Apple Mobile Web App Title">
        <!-- Tab Icons and theme End -->

        <!-- Open Graph -->
        <meta property="og:title" content="OG Title of the Page">
        <meta property="og:description" content="OG Description of the Page">
        <!-- <meta property="og:url" content="https://og.url"> -->
        <!-- <meta property="og:type" content="website"> -->

        <!-- OG Image -->

        <!-- Identical to og:image. -->
        <!-- <meta property="og:image" content="./images/open-graph-image.jpg"> -->
        <!-- og:image ka explicit URL version (optional, same purpose). -->
        <!-- <meta property="og:image:url" content="./images/open-graph-alt-image.jpg"> -->
        <!-- An alternate url to use if the webpage requires HTTPS. -->
        <!-- <meta property="og:image:secure_url" content="https://murtaza-amir.github.io/meta-inspector-demo/images/open-graph-image.jpg" /> -->
        <!-- Image ka MIME type batata hai (e.g. image/jpeg, image/png) -->
        <!-- <meta property="og:image:type" content="image/jpeg"> -->
        <!-- <meta property="og:image:width" content="1200"> -->
        <!-- <meta property="og:image:height" content="630"> -->
        <!-- A description of what is in the image (not a caption). -->
        <!-- <meta property="og:image:alt" content="OG Image Alt Text"> -->

        <!-- OG Image End -->

        <!-- Open Graph End -->

    </head>

    <body>

        Meta Inspector Demo

    </body>

</html>
